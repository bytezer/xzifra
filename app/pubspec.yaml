name: xzifra
description: "Xzifra — a simple, local-first expense tracker for Android."
publish_to: 'none'
version: 0.2.0+9

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.6.0
  collection: ^1.19.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.2
  home_widget: ^0.10.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  mime: ^2.1.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  quick_actions: ^1.1.1
  share_plus: ^13.3.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  sqlite3: ^3.8.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/icon/LICENSE-icon.txt

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24
